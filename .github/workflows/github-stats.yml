name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@v3
        with:
          github_user_name: Akalya-s6282
          github_token: ${{ secrets.GITHUB_TOKEN }}
